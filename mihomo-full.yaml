    type: http
    url: https://sub-1.smjcdh.top/smjc/api/v1/client/subscribe?token=f410e4da6a5079469d5a6be738181165
    interval: 86400
    path: ./smjc-provider.yaml
    exclude-filter: 剩余流量|距离下次重置|套餐到期|如果很少节点可用
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204
