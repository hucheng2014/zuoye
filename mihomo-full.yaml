  - https://doh.pub/dns-query
  nameserver:
  - 119.29.29.29
  - 223.5.5.5
  fallback:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  nameserver-policy:
    geosite:geolocation-!cn:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    +.tryrating.com:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    +.scilliance.com:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  listen: 0.0.0.0:53
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.ptlogin2.qq.com
  - +.msftconnecttest.com
  - +.msftncsi.com
proxy-providers:
