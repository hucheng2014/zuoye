- name: GCP-JP-singbox-reality
  type: vless
  server: 34.97.196.59
  port: 57566
  uuid: c0ecbc93-c6f5-4a24-b2bf-b7ce411fbe5e
  network: tcp
  tls: true
  servername: aws.amazon.com
  client-fingerprint: chrome
  reality-opts:
    public-key: RFTzjE5-7poocDh3zJcuvK__E3mRFP-6k-VXXpTNUS4
    short-id: ''
  flow: xtls-rprx-vision
proxy-groups:
- name: 手动选择
  type: select
  use:
  - smjc
  proxies:
  - DIRECT
  - GCP-JP-singbox-reality
- name: 自动选择
  type: url-test
  use:
  - smjc
  url: http://www.gstatic.com/generate_204
  interval: 300
  proxies:
  - GCP-JP-singbox-reality
- name: 故障转移
